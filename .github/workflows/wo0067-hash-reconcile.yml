name: WO0067 Hash Reconciliation

on:
  push:
    branches:
      - iris-wo-0067-purge-hive-namespace-20260928

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iris-wo-0067-purge-hive-namespace-20260928
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile source blob references to migrated files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess

          BASE = "95d58dd7a3b1275f4aaff4f147f2be852ecad588"
          ROOT = Path(".")
          EXCLUDE = {
              Path(".engineering/context-locks/IRIS-WO-0067-NAMESPACE-PURGE.json"),
              Path(".github/workflows/wo0067-hash-reconcile.yml"),
          }
          special = (
              ("IRIS-WO-0066-RETIRE-HIVE-STANDALONE", "IRIS-WO-0066-STANDALONE-CONTEXT-MIGRATION"),
              ("IRIS-WO-0001-GEF-HIVE-BOOTSTRAP", "IRIS-WO-0001-GEF-STANDALONE-BOOTSTRAP"),
              ("IRIS-WO-0021-HIVE-CONTEXT-PROMPTS", "IRIS-WO-0021-IRIS-CONTEXT-PROMPTS"),
          )

          def clean_name(text: str) -> str:
              for old, new in special:
                  text = text.replace(old, new)
              text = re.sub(r"(?<![A-Za-z])HIVE(?![A-Za-z])", "IRIS", text)
              text = re.sub(r"(?<![A-Za-z])Hive(?![A-Za-z])", "IRIS", text)
              text = re.sub(r"(?<![A-Za-z])hive(?![A-Za-z])", "iris", text)
              return text

          raw = subprocess.check_output(["git","ls-tree","-r","-z",BASE])
          base = {}
          for row in raw.split(b"\0"):
              if not row: continue
              header, p = row.split(b"\t",1)
              mode, kind, sha = header.split(b" ",2)
              if kind == b"blob":
                  base[p.decode()] = sha.decode()

          aliases = {}
          targets = {}
          for old_path, old_sha in base.items():
              new_path = clean_name(old_path)
              path = ROOT / new_path
              if path.is_file() and path not in EXCLUDE:
                  targets[new_path] = path
                  aliases.setdefault(new_path,set()).add(old_sha)

          def blob_sha(path: Path) -> str:
              data = path.read_bytes()
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          total = 0
          for iteration in range(1, 61):
              replacements = {}
              for name, path in targets.items():
                  current = blob_sha(path)
                  for old in aliases[name]:
                      if old != current:
                          replacements[old] = current
                  aliases[name].add(current)

              changed = 0
              for path in ROOT.rglob("*"):
                  if not path.is_file() or path in EXCLUDE or ".git" in path.parts:
                      continue
                  try:
                      text = path.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue
                  new = text
                  for old, cur in replacements.items():
                      if old in new:
                          new = new.replace(old, cur)
                  if new != text:
                      path.write_text(new, encoding="utf-8")
                      changed += 1
              total += changed
              print(f"iteration={iteration} changed_files={changed} mappings={len(replacements)}")
              if changed == 0:
                  break
          else:
              raise SystemExit("hash reconciliation did not converge")

          print(f"hash_reconciliation_total_file_updates={total}")
          PY
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/wo0067-hash-reconcile.yml
      - name: Commit reconciled source hashes
        shell: bash
        run: |
          git config user.name "KayzenRoot Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(wo0067): reconcile migrated source blob references"
          git push origin HEAD:iris-wo-0067-purge-hive-namespace-20260928
